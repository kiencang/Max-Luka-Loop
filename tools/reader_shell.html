<!-- SHELL_CSS_START -->
<style data-reader-shell="1">
body { max-width: 740px; }
.rsfv-toolbar { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 1.2rem; padding-bottom: 0.8rem; border-bottom: 1px solid var(--border, #dcdad3); font-size: 0.85rem; }
.rsfv-btn { cursor: pointer; background: var(--surface, #f3f2ee); color: var(--text, #222222); border: 1px solid var(--border, #dcdad3); border-radius: 6px; padding: 5px 11px; font-family: inherit; font-size: 0.85rem; }
.rsfv-btn.active { background: var(--accent, #0369a1); color: #ffffff; border-color: var(--accent, #0369a1); font-weight: 600; }
.rsfv-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.rsfv-width-ctrl { display: inline-flex; align-items: center; gap: 4px; margin-right: auto; }
.rsfv-width-val { min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted, #555555); }
.rsfv-toc-box { background: var(--surface, #f3f2ee); border: 1px solid var(--border, #dcdad3); border-left: 4px solid var(--accent, #0369a1); border-radius: 6px; padding: 12px 18px; margin: 1.2rem 0 1.8rem; font-size: 0.95rem; }
.rsfv-toc-box summary { cursor: pointer; font-weight: 700; color: var(--accent, #0369a1); }
.rsfv-toc-box ul { margin: 0.6rem 0 0; padding-left: 1.3rem; }
.rsfv-toc-box li.rsfv-toc-h3 { margin-left: 1rem; font-size: 0.92em; color: var(--muted, #555555); }
figure img { cursor: zoom-in; }
body[data-theme="dark"] figure img { filter: brightness(0.9) contrast(1.04); }
.rsfv-lightbox { position: fixed; inset: 0; z-index: 9999; background: rgba(0, 0, 0, 0.88); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; cursor: zoom-out; }
.rsfv-lightbox.open { display: flex; }
.rsfv-lightbox img { max-width: 95vw; max-height: 82vh; margin: 0 auto 12px; border-radius: 4px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); object-fit: contain; }
.rsfv-lightbox-cap { color: #f1f5f9; max-width: 820px; text-align: center; font-size: 0.95rem; line-height: 1.5; overflow-y: auto; max-height: 14vh; }
@media print {
    body { max-width: 100% !important; }
    body[data-theme="dark"] figure img { filter: none !important; }
    .rsfv-toolbar, .rsfv-lightbox { display: none !important; }
    .rsfv-toc-box { break-inside: avoid; page-break-inside: avoid; }
}
</style>
<!-- SHELL_CSS_END -->

<!-- SHELL_TOOLBAR_START -->
<div class="rsfv-toolbar" data-reader-shell="toolbar" role="toolbar" aria-label="Tùy chọn hiển thị">
    <div class="rsfv-width-ctrl" role="group" aria-label="Điều chỉnh độ rộng trang">
        <button type="button" class="rsfv-btn" id="rsfv-width-dec" data-width-delta="-10" title="Thu gọn độ rộng (-10px)">Thu gọn −</button>
        <button type="button" class="rsfv-btn rsfv-width-val" id="rsfv-width-reset" title="Nhấp để đặt lại độ rộng mặc định">740px</button>
        <button type="button" class="rsfv-btn" id="rsfv-width-inc" data-width-delta="10" title="Mở rộng độ rộng (+10px)">Mở rộng +</button>
    </div>
    <button type="button" class="rsfv-btn active" data-set-theme="light">Sáng</button>
    <button type="button" class="rsfv-btn" data-set-theme="sepia">Dịu mắt</button>
    <button type="button" class="rsfv-btn" data-set-theme="dark">Tối</button>
    <button type="button" class="rsfv-btn" id="rsfv-print-btn">In / PDF</button>
</div>
<!-- SHELL_TOOLBAR_END -->

<!-- SHELL_SCRIPT_START -->
<div id="rsfv-img-lightbox" class="rsfv-lightbox" data-reader-shell="lightbox" aria-hidden="true">
    <img alt="">
    <div class="rsfv-lightbox-cap"></div>
</div>
<script data-reader-shell="script">
(function () {
    var THEME_KEY = 'max-luka-loop-theme';
    var WIDTH_KEY = 'max-luka-loop-max-width';
    var btns = document.querySelectorAll('.rsfv-toolbar [data-set-theme]');
    function applyTheme(t, persist) {
        if (t !== 'light' && t !== 'sepia' && t !== 'dark') t = 'light';
        if (t === 'light') document.body.removeAttribute('data-theme');
        else document.body.setAttribute('data-theme', t);
        btns.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-set-theme') === t); });
        if (persist) {
            try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
        }
    }
    btns.forEach(function (b) { b.addEventListener('click', function () { applyTheme(b.getAttribute('data-set-theme'), true); }); });
    try {
        var savedTheme = localStorage.getItem(THEME_KEY);
        if (savedTheme) applyTheme(savedTheme, false);
    } catch (e) {}

    var decBtn = document.getElementById('rsfv-width-dec');
    var incBtn = document.getElementById('rsfv-width-inc');
    var valBtn = document.getElementById('rsfv-width-reset');
    if (decBtn && incBtn && valBtn) {
        var MIN_W = 480, MAX_W = 1400, STEP_W = 10;
        var defaultW = 740;
        var currentW = defaultW;

        function applyWidth(w, persist) {
            var clamped = Math.max(MIN_W, Math.min(MAX_W, Math.round(w)));
            currentW = clamped;
            if (clamped === defaultW) document.body.style.removeProperty('max-width');
            else document.body.style.maxWidth = clamped + 'px';
            valBtn.textContent = clamped + 'px';
            decBtn.disabled = (clamped <= MIN_W);
            incBtn.disabled = (clamped >= MAX_W);
            if (persist) {
                try {
                    if (clamped === defaultW) localStorage.removeItem(WIDTH_KEY);
                    else localStorage.setItem(WIDTH_KEY, String(clamped));
                } catch (e) {}
            }
        }

        try {
            var savedW = parseInt(localStorage.getItem(WIDTH_KEY), 10);
            if (!isNaN(savedW) && savedW >= MIN_W && savedW <= MAX_W) currentW = savedW;
        } catch (e) {}
        applyWidth(currentW, false);

        decBtn.addEventListener('click', function () { applyWidth(currentW - STEP_W, true); });
        incBtn.addEventListener('click', function () { applyWidth(currentW + STEP_W, true); });
        valBtn.addEventListener('click', function () { applyWidth(defaultW, true); });
    }

    if (!document.getElementById('rsfv-doc-toc') && !document.getElementById('doc-toc')) {
        var heads = document.querySelectorAll('article h2, article h3, main h2, main h3');
        var h2Count = document.querySelectorAll('article h2, main h2').length || document.querySelectorAll('h2').length;
        if (!heads.length) heads = document.querySelectorAll('h2, h3');
        if (h2Count >= 3 && heads.length >= 3) {
            var nav = document.createElement('nav');
            nav.id = 'rsfv-doc-toc'; nav.className = 'rsfv-toc-box';
            var det = document.createElement('details'); det.open = true;
            det.innerHTML = '<summary>Mục lục nội dung</summary><ul></ul>';
            var ul = det.querySelector('ul');
            heads.forEach(function (h, i) {
                if (!h.id) h.id = 'rsfv-sec-' + (i + 1);
                var li = document.createElement('li');
                if (h.tagName === 'H3') li.className = 'rsfv-toc-h3';
                var a = document.createElement('a'); a.href = '#' + h.id; a.textContent = h.textContent;
                li.appendChild(a); ul.appendChild(li);
            });
            nav.appendChild(det);
            var anchor = document.querySelector('header') || document.querySelector('h1');
            if (anchor && anchor.parentNode) anchor.parentNode.insertBefore(nav, anchor.nextSibling);
        }
    }

    var printBtn = document.getElementById('rsfv-print-btn');
    if (printBtn) { printBtn.addEventListener('click', function () { window.print(); }); }

    var lb = document.getElementById('rsfv-img-lightbox'), lbImg = lb.querySelector('img'), lbCap = lb.querySelector('.rsfv-lightbox-cap');
    function closeLightbox() {
        lb.classList.remove('open');
        lb.setAttribute('aria-hidden', 'true');
        lbImg.removeAttribute('src');
    }
    document.querySelectorAll('figure img').forEach(function (img) {
        img.title = 'Nhấp để phóng to';
        img.addEventListener('click', function () {
            lbImg.src = img.src; lbImg.alt = img.alt || '';
            var fc = img.closest('figure') && img.closest('figure').querySelector('figcaption');
            lbCap.textContent = fc ? fc.textContent.trim() : (img.alt || '');
            lb.classList.add('open');
            lb.setAttribute('aria-hidden', 'false');
        });
    });
    lb.addEventListener('click', closeLightbox);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLightbox(); });
})();
</script>
<!-- SHELL_SCRIPT_END -->
